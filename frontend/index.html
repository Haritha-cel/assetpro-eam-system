  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0B1015;
      /* Darker, richer background */
      --surface: #141B22;
      --surface2: #1A232C;
      --teal: #2DD4BF;
      /* Slightly softer, more modern teal */
      --amber: #FBBF24;
      --red: #F87171;
      --blue: #60A5FA;
      --green: #4ADE80;
      --muted: #7B8794;
      /* Warmer gray */
      --border: rgba(255, 255, 255, 0.06);
      /* Much softer borders */
      --text: #E2E8F0;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -2px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -4px rgba(0, 0, 0, 0.4);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Sans', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--surface2);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--muted);
    }

    /* ── Layout ─────────────── */
    .app {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 240px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      box-shadow: var(--shadow-md);
      z-index: 10;
    }

    .sidebar-logo {
      padding: 24px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-box {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--teal), #06b6d4);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(45, 212, 191, 0.2);
    }

    nav {
      flex: 1;
      padding: 16px 12px;
      overflow-y: auto;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      border-radius: 8px;
      transition: all .2s ease;
      margin-bottom: 2px;
    }

    .nav-link:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.04);
    }

    .nav-link.active {
      color: var(--teal);
      background: rgba(45, 212, 191, 0.08);
      font-weight: 600;
    }

    .sidebar-user {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg);
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    .topbar {
      height: 60px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 32px;
      gap: 16px;
      flex-shrink: 0;
    }

    .page-content {
      flex: 1;
      overflow-y: auto;
      padding: 28px 32px;
    }

    /* ── Common components ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow .2s ease;
    }

    .card:hover {
      box-shadow: var(--shadow-md);
    }

    .card-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.01) 0%, rgba(255, 255, 255, 0) 100%);
      border-radius: 14px 14px 0 0;
    }

    .card-body {
      padding: 20px 24px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .card-sub {
      font-size: 11px;
      color: var(--muted);
      margin-left: auto;
      font-weight: 500;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .kpi {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 22px;
      box-shadow: var(--shadow-sm);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .kpi:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .kpi-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
      font-weight: 500;
    }

    /* REMOVED UPPERCASE */
    .kpi-value {
      font-size: 30px;
      font-weight: 700;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: -1px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    /* ── Table ── */
    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .5px;
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: rgba(255, 255, 255, .015);
    }

    .mono {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
    }

    /* ── Badges ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .b-active {
      background: rgba(74, 222, 128, .1);
      color: #4ADE80;
    }

    .b-maintenance {
      background: rgba(251, 191, 36, .1);

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      transition: all .15s ease;
      font-family: inherit;
      font-weight: 500;
    }

    .btn:hover {
      background: rgba(255, 255, 255, .08);

    .btn-primary {
      background: var(--teal);
      color: #0B1015;
      border-color: var(--teal);
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(45, 212, 191, 0.2);
    }

    .btn-primary:hover {
      background: #5EEAD4;
      box-shadow: 0 4px 12px rgba(45, 212, 191, 0.3);
      transform: translateY(-1px);
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 12px;
    }

    .btn-danger {
      border-color: rgba(248, 113, 113, .3);
      color: var(--red);

    }

    .btn:disabled {

    /* ── Form ── */
    .form-group {

    /* ── Misc ── */
    .maintenance-ring {
      position: relative;
      width: 38px;
      height: 38px;
      flex-shrink: 0;
    }

    .maintenance-ring svg {
      transform: rotate(-90deg);
    }

    .ring-pct {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      font-weight: 700;
    }

    .stock-bar {
      flex: 1;
      height: 4px;
      background: rgba(255, 255, 255, .05);
      border-radius: 2px;
    }

    .stock-bar-fill {
      height: 4px;
      border-radius: 2px;
      transition: width .3s;
    }

    .alert-banner {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-radius: 10px;
      border: 1px solid rgba(248, 113, 113, .2);
      background: rgba(248, 113, 113, .05);
      margin-bottom: 20px;
      font-size: 13px;
    }

    .spinner {
      display: inline-block;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--muted);
    }

    .empty-state i {
      font-size: 36px;
      display: block;
      margin-bottom: 12px;
      opacity: 0.5;
    }
  </style>
</head>

  <div id="toast"><i class="ti ti-check"></i><span id="toast-msg"></span></div>
